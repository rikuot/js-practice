<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

<body>
    <h1>形状選択</h1>

<label>
    <input type="radio" name="shape" value="circle">
    正円
</label>

<label>
    <input type="radio" name="shape" value="rectangle">
    長方形
</label>

<label>
    <input type="radio" name="shape" value="square">
    正方形
</label>

<div class="circle size-wrapper">
    直径：<input type="number">mm
</div>

<div class="rectangle size-wrapper">
    縦：<input type="number">mm
    横：<input type="number">mm
</div>

<div class="square size-wrapper">
    一辺：<input type="number">mm
</div>
</body>
